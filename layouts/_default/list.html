{{ define "main" }}

    <h1>{{ .Title }}</h1>

    {{ .Content }}

    <div class="content-list">
        {{ range .Pages }}
            <article>
                <h2>
                    <a href="{{ .RelPermalink }}">
                        {{ .Title }}
                    </a>
                </h2>

                <p>{{ .Summary }}</p>

                <time>
                    {{ .Date.Format "January 2, 2006" }}
                </time>
            </article>
        {{ end }}
    </div>

{{ end }}
