{{ define "main" }}

<article class="single-post">

    <header class="post-header">
        <h1>{{ .Title }}</h1>

        <div class="post-meta">
            <time datetime="{{ .Date.Format "2006-01-02" }}">
                {{ .Date.Format "January 2, 2006" }}
            </time>

            <span>By {{ .Site.Params.author }}</span>
        </div>
    </header>

    <div class="post-content">
        {{ .Content }}
    </div>

</article>

{{ end }}
